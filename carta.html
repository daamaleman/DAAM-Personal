<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novios</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <style>
        :root{
        --heart-color: #ff5873;
        --hover-color: #C1275C;
        --background-color: #ebc8c0;
        --white: #fff;
    }
  body {
    font-family: Arial, sans-serif;
    background-color: var(--background-color);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
    color: var(--heart-color);
    background-image: url('images/mini-hearth.png');
    background-size: 50%;
  }
  .card {
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    width: 300px;
  }
  .title {
    font-size: 24px;
    margin-top: 0;
  }
  .heart {
    width: 200px;
    height: 200px;
    position: relative;
    display: inline-block;
    margin-bottom: 15px;
    background-repeat:  no-repeat;
    background-size: 100%;
  }
  
  .button {
    background-color: var(--heart-color);
    color: var(--white);
    border: none;
    padding: 10px 20px;
    text-align: center;
    display: inline-block;
    font-size: 16px;
    margin: 10px 2px;
    cursor: pointer;
    border-radius: 5px;
    width: 80px;
  }
  .button.button__negative{
    background-color: var(--white);
    color: var(--heart-color);
    border: 1px solid var(--heart-color);
  }
  .button.button__error{
    width: 100%;
    display: none;
  }
  .button:focus {
    outline: none;
  }
  .text {
    font-size: 14px;
    margin-top: 30px;
  }
  .img-fluid {
    width: 100%;
    height: auto;
  }
    </style>
<div class="card">
    <h1 class="title">¿Te gustaría ser mi Novia?</h1>
    <div class="heart">
        <img src="images/cat-01.gif" alt="San Valentin" class="cat img-fluid">
    </div>
    <div class="text"></div>
    <button class="button">SÍ</button>
    <button class="button button__negative">NO</button>
    <button class="button button__error">Error debemos reiniciar</button>
</div>
<script>
    const alternatives = [
    {text:"", images:"images/cat-01.gif"},
    {text:"Te prometo que será inolvidable", images:"images/cat-02.gif"},
    {text:"Piénsalo de nuevo", images:"images/cat-03.gif"},
    {text:"Vamos, atrévete a decir que sí", images:"images/cat-04.gif"},
    {text:"Que el miedo no te detenga", images:"images/cat-05.gif"}
];
const ohyes = {text:"Sabía que aceptarías", images:"images/cat-yes.gif"};
const title = document.querySelector('.title');
const text = document.querySelector('.text');
const cat = document.querySelector('.cat');
const buttons = document.querySelectorAll('.button');
const errorButton = document.querySelector('.button__error');

let count = 0;
function updateDisplay(item) {
    console.log(item);
    cat.src = item.images;
    text.innerHTML = item.text;
}

errorButton.addEventListener('click', () => {
    count = 0;
    updateDisplay(alternatives[count]);
    buttons.forEach(btn => btn.style.display = 'inline-block');
    errorButton.style.display = 'none';
});

buttons.forEach(button => {
    button.addEventListener('click', () => {
        if(button.textContent === 'SÍ'){
            updateDisplay(ohyes);
            buttons.forEach(btn => btn.style.display = 'none');
        }
        if (button.textContent === 'NO'){
            count++;
            if(count < alternatives.length){
                updateDisplay(alternatives[count]);
            } else {
                buttons.forEach(btn => btn.style.display = 'none');
                errorButton.style.display = 'inline-block';
            }
        }
    });
});
</script>
<script src="script.js"></script>
</body>
</html>
